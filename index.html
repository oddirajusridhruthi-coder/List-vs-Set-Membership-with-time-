<!DOCTYPE html>
<html>
<head>
    <title>Set vs List Membership Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f4;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Set vs List Membership Check</h2>

    <input type="text" id="numbers" placeholder="Enter numbers separated by commas">
    <br>
    <input type="number" id="searchValue" placeholder="Number to search">
    <br>
    <button onclick="compare()">Compare</button>

    <h3>Results</h3>
    <p id="listResult"></p>
    <p id="setResult"></p>
</div>

<script>
function compare() {
    // 1. Get user input values
    var inputString = document.getElementById("numbers").value;
    var nums = inputString.split(",").map(Number);
    var target = Number(document.getElementById("searchValue").value);

    // Number of iterations to make the test measurable
    var iterations = 1000;
    var counter = 0;

    // 2. Measure List Search (Repeated in a simple loop)
    var startList = performance.now();
    var foundInList = false;
    
    counter = 0;
    while (counter < iterations) {
        foundInList = nums.includes(target);
        counter = counter + 1;
    }
    var endList = performance.now();
    var listTime = endList - startList;

    // 3. Measure Set Search (Pre-built outside the timed loop for a fair lookup test)
    var mySet = new Set(nums);
    
    var startSet = performance.now();
    var foundInSet = false;
    
    counter = 0;
    while (counter < iterations) {
        foundInSet = mySet.has(target);
        counter = counter + 1;
    }
    var endSet = performance.now();
    var setTime = endSet - startSet;

    // 4. Determine status text strings
    var listStatus = "";
    if (foundInList) {
        listStatus = "Found";
    } else {
        listStatus = "Not Found";
    }

    var setStatus = "";
    if (foundInSet) {
        setStatus = "Found";
    } else {
        setStatus = "Not Found";
    }

    // 5. Update UI with the final results
    document.getElementById("listResult").innerHTML =
        "List Search Time: " + listTime.toFixed(4) +
        " ms | Complexity: O(n) | Status: " + listStatus;

    document.getElementById("setResult").innerHTML =
        "Set Search Time: " + setTime.toFixed(4) +
        " ms | Complexity: O(1) | Status: " + setStatus;
}
</script>

</body>
</html>
