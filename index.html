<!DOCTYPE html>
<html>
<head>
    <title>Student Membership Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f4;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Membership Check (List vs Set vs DFS)</h2>

    <input type="number" id="searchValue" placeholder="Enter roll number to search">
    <br>
    <button onclick="compare()">Compare</button>

    <h3>Results</h3>
    <p id="listResult"></p>
    <p id="setResult"></p>
    <p id="dfsResult"></p>
</div>

<script>
// Student roll numbers
var students = [101,102,103,104,105,106,107,108,109,110];

// Set membership
var studentSet = new Set(students);

// Recursive DFS search
function dfs(arr, target) {
    function helper(index) {
        if (index >= arr.length)
            return false;

        if (arr[index] === target)
            return true;

        return helper(index + 1);
    }

    return helper(0);
}

function compare() {

    var target = Number(document.getElementById("searchValue").value);
    var iterations = 1000;

    // List Membership (includes)
    var startList = performance.now();
    var foundList = false;

    for (var i = 0; i < iterations; i++) {
        foundList = students.includes(target);
    }

    var endList = performance.now();
    var listTime = endList - startList;


    // Set Membership (has)
    var startSet = performance.now();
    var foundSet = false;

    for (var i = 0; i < iterations; i++) {
        foundSet = studentSet.has(target);
    }

    var endSet = performance.now();
    var setTime = endSet - startSet;


    // DFS Search
    var startDFS = performance.now();
    var foundDFS = false;

    for (var i = 0; i < iterations; i++) {
        foundDFS = dfs(students, target);
    }

    var endDFS = performance.now();
    var dfsTime = endDFS - startDFS;


    // Display Results
    document.getElementById("listResult").innerHTML =
        "List Membership (includes): " +
        listTime.toFixed(4) +
        " ms | Complexity: O(n) | Status: " +
        (foundList ? "Found" : "Not Found");

    document.getElementById("setResult").innerHTML =
        "Set Membership (has): " +
        setTime.toFixed(4) +
        " ms | Complexity: O(1) | Status: " +
        (foundSet ? "Found" : "Not Found");

    document.getElementById("dfsResult").innerHTML =
        "DFS Search: " +
        dfsTime.toFixed(4) +
        " ms | Complexity: O(n) | Status: " +
        (foundDFS ? "Found" : "Not Found");
}
</script>

</body>
</html>
